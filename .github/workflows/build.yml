name: Build

# На каждый push в main: сборка в Visual Studio (проверка, что код компилируется).
# Если версии из .github/release-version ещё нет в релизах - публикуется новый релиз
# с тегом этой версии и описанием из .github/release-notes.md.
# Выпустить новую версию = поменять номер в .github/release-version и описание.
# Заменить архив у уже вышедшей версии = написать в коммите "пересобрать релиз".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        run: msbuild ElectroGuiCalc.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Read version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content .github/release-version -Raw).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view $v --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0

      - name: Package
        shell: pwsh
        run: |
          # Отдельная папка, чтобы в архив не попали промежуточные файлы сборки
          $out = "pkg/ElectroGuiCalc"
          New-Item -ItemType Directory -Force -Path $out, "$out/fonts", "$out/lectures" | Out-Null
          Copy-Item "x64/Release/ElectroGuiCalc.exe" $out
          Copy-Item "fonts/fa-solid-900.ttf" "$out/fonts"
          Copy-Item "lectures/*.pdf" "$out/lectures"
          # d3dcompiler_47.dll - нужен ImGui для DirectX 11. В Windows 8.1-11 он встроен,
          # а в Windows 7 бывает только с обновлениями - кладём рядом с программой.
          $dll = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Redist\D3D\x64\d3dcompiler_47.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) { $dll = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Redist" -Recurse -Filter d3dcompiler_47.dll -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1 }
          if ($dll) { Copy-Item $dll.FullName $out; Write-Host "added $($dll.FullName)" } else { Write-Warning "d3dcompiler_47.dll not found in Windows SDK" }
          Compress-Archive -Path $out -DestinationPath "ElectroGuiCalc-${{ steps.ver.outputs.version }}.zip"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ElectroGuiCalc
          path: ElectroGuiCalc-*.zip

      - name: Publish release
        if: steps.ver.outputs.exists == 'false' || contains(github.event.head_commit.message, 'пересобрать релиз')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ElectroGuiCalc ${{ steps.ver.outputs.version }}
          body_path: .github/release-notes.md
          files: ElectroGuiCalc-*.zip
          make_latest: true
